[build]
builder = "nixpacks"
buildCommand = "cd frontend && npm install --legacy-peer-deps && npm run build && cd ../backend && npm install"

[deploy]
startCommand = "cd backend && npm run migrate:undo && npm run migrate && node index.js"
restartPolicyType = "ON_FAILURE"

[mount]
source = "."
destination = "/app"

[service]
name = "TVGM"